<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>پستچی و اپ موبایل | The Postman & the Mobile App</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@600;700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c1e;--surface:#14142b;--soft:#1e1e3c;--ink:#ecebff;--mut:#9a9bc6;--line:#2a2a50;--wire:#55558a;
  --api:#b9a2ff;--apib:#241d4d;--db:#a9b4d0;--dbb:#1a1b36;--mq:#f5b942;--mqb:#2e2410;
  --ns:#4fd1c2;--nsb:#0f3030;--ext:#a8a8c4;--extb:#1e1e36;
  --ok:#4cc47a;--okb:#11301f;--wa:#f5b942;--wab:#2e2410;--td:#ff8f85;--tdb:#3d1a17;
  --onp:#0c0c1e;--skin:#f2c29b;--ink2:#2b2118;--app:#222222;--appb:#375a7f;
  --f:"Vazirmatn",Tahoma,sans-serif;--m:"IBM Plex Mono",ui-monospace,Consolas,monospace;--serif:"Playfair Display",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);
  background-image:radial-gradient(rgba(185,162,255,.16) 1px,transparent 1.3px);background-size:24px 24px;
  color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.8;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1,h2,h3,p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--m);font-size:.88em}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.8rem;color:var(--mut);font-weight:600}
h1{font-size:clamp(1.4rem,3vw,2rem);line-height:1.3;font-weight:800}
html[lang="en"] h1{font-family:var(--serif);font-weight:700}
.hint{color:var(--mut);font-size:.82rem}
.lang{display:flex;direction:ltr;gap:2px;padding:3px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.lang button{font:600 .9rem var(--f);border:0;background:transparent;color:var(--ink);padding:1px 18px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--api);color:var(--onp)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 .95rem var(--f);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:2px 16px;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--api);background:var(--apib);color:var(--api)}
.view{display:none;flex-direction:column;gap:10px}
.view.on{display:flex}
.stage{background:rgba(20,20,43,.62);border:1px solid var(--line);border-radius:18px;overflow-x:auto;overflow-y:hidden;direction:ltr}
svg{display:block;width:100%;height:auto;min-width:760px}
html[lang="fa"] .fa{direction:rtl;unicode-bidi:plaintext}
html[lang="en"] .fa{direction:ltr;unicode-bidi:normal}
.t1{font:800 17px var(--f);fill:var(--ink)}
.t2{font:400 12px var(--m);fill:var(--mut)}
.t2f{font:600 12px var(--f);fill:var(--mut)}
.wire{fill:none;stroke:var(--wire);stroke-width:2;stroke-dasharray:5 6}
.box{stroke-width:2}
.halo{fill:none;stroke:var(--gl);stroke-width:9;opacity:0;transition:opacity .3s}
.node.on .halo{opacity:.28}
.node.on .box{stroke-width:3}
.off{display:none}
.row rect{stroke-width:1.5}
.row.nu rect{fill:var(--nsb);stroke:var(--ns)}
.row.us rect{fill:var(--soft);stroke:var(--wire)}
.row text{font:600 13px var(--m);fill:var(--ink)}
.stamp{font:800 15px var(--f);fill:var(--ok)}
.sms rect{fill:var(--okb);stroke:var(--ok);stroke-width:1.5}
.sms text{font:600 11px var(--m);fill:var(--ok);text-anchor:middle}
.lab rect{fill:var(--c)}
.lab text{font:600 12px var(--m);fill:var(--onp);text-anchor:middle}
.env{fill:var(--surface);stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.envf{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.leg{transform-box:fill-box;transform-origin:50% 0}
.walking .legL{animation:swL .36s ease-in-out infinite alternate}
.walking .legR{animation:swR .36s ease-in-out infinite alternate}
@keyframes swL{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes swR{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.vib{transform-box:fill-box;transform-origin:center;animation:vib .6s}
@keyframes vib{0%,100%{transform:translate(0)}15%{transform:translate(-4px,0) rotate(-3deg)}35%{transform:translate(4px,0) rotate(3deg)}55%{transform:translate(-3px,0)}75%{transform:translate(3px,0)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.mouth-s{display:none}.sad .mouth-s{display:block}.sad .mouth-h{display:none}
.ap{font:600 11px var(--m);fill:#ecebff}
.apm{font:400 9px var(--m);fill:#9a9bc6}
.apt{font:800 14px var(--f);fill:#ecebff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;font-size:.85rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;line-height:1.9}
.chip b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--apib);color:var(--api);font-size:.75rem}
.chip.p2 b{background:var(--wab);color:var(--wa)}
.chip.cur{border-color:var(--api);background:var(--apib)}
.chip.p2.cur{border-color:var(--wa);background:var(--wab)}
.chip.done b{background:var(--ns);color:var(--onp)}
.chip.p2.done b{background:var(--wa);color:var(--onp)}
.chip:focus-visible,button:focus-visible,.tab:focus-visible{outline:3px solid var(--api);outline-offset:2px}
.panel{background:rgba(20,20,43,.9);border:1px solid var(--line);border-radius:18px;padding:12px 18px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px 22px}
.pl{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta{display:flex;gap:10px;align-items:center}
.phase{font-size:.75rem;font-weight:800;border-radius:999px;padding:0 10px;background:var(--apib);color:var(--api)}
.phase.x{background:var(--wab);color:var(--wa)}
.count{font-size:.8rem;color:var(--mut)}
.panel h3{font-size:1.1rem;font-weight:800;line-height:1.5}
.panel p{max-width:70ch;font-size:.93rem}
.code{margin-top:4px;font:400 .8rem var(--m);direction:ltr;unicode-bidi:isolate;text-align:left;background:var(--soft);border-radius:8px;padding:2px 10px;width:fit-content;max-width:100%;overflow-x:auto}
.quote{background:var(--wab);border-radius:14px;padding:8px 14px;border-inline-start:4px solid var(--wa);align-self:start}
.quote small{display:block;font-size:.75rem;font-weight:800;color:var(--wa)}
.quote q{quotes:none;font-size:.93rem}
.ctl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{font:inherit;font-weight:600;border:0;border-radius:12px;padding:2px 18px;cursor:pointer;background:var(--api);color:var(--onp)}
button.b.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
button.b:disabled{opacity:.45;cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{text-align:start;font:inherit;color:var(--ink);background:rgba(20,20,43,.9);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card[aria-expanded="true"]{border-color:var(--api);background:var(--apib)}
.card .ic{font-size:1.8rem;line-height:1.2}
.card h3{font-size:1.02rem;font-weight:800}
.card .as{color:var(--wa);font-weight:600;font-size:.88rem}
.card .more{display:none;font-size:.88rem;color:var(--ink)}
.card[aria-expanded="true"] .more{display:block}
.card .files{font:400 .74rem var(--m);direction:ltr;unicode-bidi:isolate;text-align:left;color:var(--mut);background:var(--soft);border-radius:8px;padding:2px 8px;margin-top:2px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;direction:ltr;justify-content:center;background:rgba(20,20,43,.62);border:1px solid var(--line);border-radius:18px;padding:12px}
.flow span{font:600 .8rem var(--m);border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.flow i{color:var(--api);font-style:normal}
.note{background:rgba(20,20,43,.9);border:1px solid var(--line);border-radius:18px;padding:12px 18px}
.note h3{font-size:1.02rem;font-weight:800;margin-bottom:2px}
.note p{font-size:.93rem;max-width:80ch}
.vwrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.player{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--api);background:#000;aspect-ratio:9/16;max-height:78vh}
.player video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.bigplay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(12,12,30,.25),rgba(12,12,30,.55));border:0;cursor:pointer;padding:0}
.bigplay span{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--api);color:var(--onp);font-size:34px;box-shadow:0 0 0 10px rgba(185,162,255,.25);transition:transform .2s}
.bigplay:hover span{transform:scale(1.08)}
.bigplay.gone{display:none}
.vinfo{display:flex;flex-direction:column;gap:8px}
.vinfo ul{margin:0;padding-inline-start:20px}
.vinfo a{color:var(--api);font-weight:600}
@media (max-width:760px){.panel{grid-template-columns:1fr}.vwrap{grid-template-columns:1fr}.player{max-width:320px;margin-inline:auto}}
@media (prefers-reduced-motion:reduce){.walking .legL,.walking .legR,.hop,.vib,.pop{animation:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 data-t="h1"></h1>
    <div class="hint" data-t="hint"></div>
  </div>
  <div class="lang" role="group" data-aria="langLabel">

<div class="stage">

<div class="chips" id="chips" role="group" data-aria="stepsLabel"></div>

<div class="panel" aria-live="polite">

    <p id="text"></p>
    <div class="code" id="code"></div>
  </div>
  <div class="quote"><small data-t="saysLabel"></small><q id="quote"></q></div>

    <button class="b alt" id="prev" type="button" data-t="prev"></button>

</section>

<script>
(function(){
var NS='http://www.w3.org/2000/svg';
var $=function(s){return document.querySelector(s)};

function nodeState(i,phase){
  ph=phase;
  var s=STEPS[i];
  ['phone','api','rmq','ns','sql'].forEach(function(n){
    $('#n-'+n).classList.toggle('on',s.active.indexOf(n)>-1);

  screen(phase==='end'?s.s1:s.s0);
  var bubble=(i===3&&phase==='end')||s.keepSms===true;
  show($('#smsMsg'),bubble);
  var row=$('#sqlrow');

  var isUsed=(i===5&&phase==='end')||i>5;
  row.setAttribute('class','row '+(isUsed?'us':'nu')+(rowOn?'':' off'));

function confetti(){
  var g=$('#conf');g.innerHTML='';
  var cols=['--api','--mq','--ns','--ok','--wa'];
  for(var k=0;k<16;k++){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',130);c.setAttribute('cy',100);c.setAttribute('r',4);
    c.setAttribute('fill','var('+cols[k%5]+')');g.appendChild(c);
    var a=Math.PI*2*k/16,d=60+Math.random()*40;
    if(c.animate&&!reduce)c.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-20)+'px)',opacity:0}],{duration:1100,easing:'ease-out'});
  }
  setTimeout(clearConf,1150);
}
function clearConf(){$('#conf').innerHTML=''}
function vibrate(id){var el=$(id);el.classList.remove('vib');void el.getBoundingClientRect();el.classList.add('vib')}
function hopNow(){pmHop.classList.remove('hop');void pmHop.getBoundingClientRect();pmHop.classList.add('hop')}
function run(pts,dur,onpos,tk,done){
  var seg=[],tot=0,i;
  for(i=1;i<pts.length;i++){var l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);tot+=l}
  var t0=null;
  function frame(ts){
    if(tk!==token)return;
    if(t0===null)t0=ts;
    var t=Math.min(1,(ts-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,d=e*tot,k=0;
    while(k<seg.length-1&&d>seg[k]){d-=seg[k];k++}
    var f=seg[k]?d/seg[k]:1,x=pts[k][0]+(pts[k+1][0]-pts[k][0])*f,y=pts[k][1]+(pts[k+1][1]-pts[k][1])*f;
    var dx=pts[k+1][0]-pts[k][0];
    onpos(x,y,dx,ts);
    if(t<1)requestAnimationFrame(frame);else done();
  }
  requestAnimationFrame(frame);
}
function smsFly(tk){
  return new Promise(function(res){
    var pts=[[955,152],[955,380],[130,380],[130,356]],g=$('#conf');g.innerHTML='';
    var e=document.createElementNS(NS,'g');
    e.innerHTML='<rect x="-17" y="-12" width="34" height="24" rx="3" fill="var(--okb)" stroke="var(--ok)" stroke-width="2"/><path d="M-17 -12L0 2L17 -12" fill="none" stroke="var(--ok)" stroke-width="2"/>';
    g.appendChild(e);
    function place(x,y){e.setAttribute('transform','translate('+x+' '+y+')')}
    function finish(){g.innerHTML='';res()}
    run(pts,reduce?1:1900,place,tk,finish);
  });
}
function panel(i){
  var s=STEPS[i],u=UI[lang];
  $('#phase').textContent=i<4?u.part1:u.part2;
  $('#phase').className='phase'+(i>=4?' x':'');
  $('#count').textContent=u.count(i+1,STEPS.length);
  $('#title').textContent=s[lang].title;
  $('#text').textContent=s[lang].text;
  $('#code').textContent=s.code;
  $('#quote').textContent=s[lang].quote;
  Array.prototype.forEach.call(chips.children,function(b,k){
    b.classList.toggle('cur',k===i);b.classList.toggle('done',k<i);
    if(k===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
  });
  $('#prev').disabled=i===0;
  $('#next').disabled=i===STEPS.length-1;
}
function nextAuto(){
  if(!playing)return;
  if(cur<STEPS.length-1)go(cur+1);else stopPlay();
}
function go(i){
  token++;var tk=token;cur=i;
  var s=STEPS[i],pts=s.path.slice();
  pm.classList.remove('sad');pmHop.classList.remove('hop');
  panel(i);nodeState(i,'start');
  $('#conf').innerHTML='';
  var dir0=Math.sign(pts[1][0]-pts[0][0])||flip;
  setPos(pts[0][0],pts[0][1],dir0);
  setLabel(s.lab,s.c);show(carry,true);
  pm.classList.add('walking');
  var len=Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1]);
  var dur=reduce?1:Math.max(1200,len/0.085);
  function onpos(x,y,dx,ts){
    var bob=reduce?0:Math.sin(ts/70)*1.6;
    setPos(x,y+bob,Math.sign(dx)||flip);
  }
  function arrived(){
    pm.classList.remove('walking');
    setPos(pts[1][0],pts[1][1],flip);
    show(carry,false);hopNow();
    nodeState(i,'end');
    var after=Promise.resolve();
    if(s.sms){after=smsFly(tk).then(function(){if(tk!==token)return;nodeState(i,'end');vibrate('#n-phone')})}
    if(s.confetti){confetti();vibrate('#n-phone')}
    if(i===STEPS.length-1)pm.classList.add('sad');
    if(i===STEPS.length-1)pm.classList.remove('sad');
    after.then(function(){
      if(tk!==token)return;
      if(playing){
        clearTimeout(timer);
        timer=setTimeout(nextAuto,1700);
      }
    });
  }
  run(pts,dur,onpos,tk,arrived);
}
function playLabel(){var b=$('#play');b.textContent=playing?UI[lang].stop:UI[lang].play;b.setAttribute('aria-pressed',playing?'true':'false')}
function stopPlay(){playing=false;clearTimeout(timer);playLabel()}

  all('.view').forEach(function(v){v.classList.toggle('on',v.id==='view-'+name)});
  if(name!=='journey')stopPlay();
  if(name!=='video'){var v=$('#vid');if(v&&!v.paused)v.pause()}
}
function onTabClick(e){setTab(e.currentTarget.getAttribute('data-tab'))}

function applyLang(l){
  lang=l;var u=UI[l];
  document.documentElement.lang=l;
  document.documentElement.dir=l==='fa'?'rtl':'ltr';
  document.title=l==='fa'?'پستچی و اپ موبایل | The Postman & the Mobile App':'The Postman & the Mobile App | پستچی و اپ موبایل';
  all('[data-t]').forEach(function(el){el.textContent=u[el.getAttribute('data-t')]});
  all('[data-aria]').forEach(function(el){el.setAttribute('aria-label',u[el.getAttribute('data-aria')])});
  $('#eyebrow').innerHTML=u.eyebrow;
  all('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===l?'true':'false')});
  buildChips();buildCards();buildVidList();playLabel();panel(cur);nodeState(cur,ph);
  try{localStorage.setItem('bm-lang',l)}catch(e){}
}
function onLangClick(e){applyLang(e.currentTarget.getAttribute('data-lang'))}
all('.lang button').forEach(function(b){b.addEventListener('click',onLangClick)});
all('.tab').forEach(function(b){b.addEventListener('click',onTabClick)});

function onPlayClick(){
  if(playing){stopPlay();return}
  playing=true;playLabel();
  if(cur>=STEPS.length-1)go(0);else go(cur);
}
function onNext(){stopPlay();if(cur<STEPS.length-1)go(cur+1)}
function onPrev(){stopPlay();if(cur>0)go(cur-1)}
$('#play').addEventListener('click',onPlayClick);
$('#next').addEventListener('click',onNext);
$('#prev').addEventListener('click',onPrev);

function onBigPlay(){
  var v=$('#vid');
  $('#bigplay').classList.add('gone');
  var p=v.play();
  if(p&&p.catch)p.catch(showControlsOnly);
}
function showControlsOnly(){$('#bigplay').classList.add('gone')}
function onVideoPause(){if($('#vid').ended)$('#bigplay').classList.remove('gone')}
$('#bigplay').addEventListener('click',onBigPlay);
$('#vid').addEventListener('ended',onVideoPause);

function onKey(e){
  if(tab!=='journey')return;
  var nextKey=lang==='fa'?'ArrowLeft':'ArrowRight',prevKey=lang==='fa'?'ArrowRight':'ArrowLeft';
  if(e.key===nextKey)onNext();
  if(e.key===prevKey)onPrev();
}
document.addEventListener('keydown',onKey);

var start='fa',startTab='journey';
try{
  var qs=new URLSearchParams(location.search);
  var ql=qs.get('lang'),qt=qs.get('tab');
  var saved=null;
  try{saved=localStorage.getItem('bm-lang')}catch(e1){}
  if(ql==='en'||ql==='fa')start=ql;else if(saved==='en'||saved==='fa')start=saved;
  if(qt==='layers'||qt==='video'||qt==='journey')startTab=qt;
}catch(e){}
applyLang(start);
setTab(startTab);
go(0);
})();
</script>
</body>
</html>
